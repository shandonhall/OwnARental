# Railway: deploy the Nest API from the monorepo root.
# Node 22 is set in nixpacks.toml (Prisma 7 needs >=20.19).

[build]
builder = "NIXPACKS"
buildCommand = "npm run prisma:generate && npm run build -w api"

[deploy]
startCommand = "npm run start:prod -w api"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
